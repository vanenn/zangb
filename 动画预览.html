<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰城余生 · 动画素材预览</title>
<style>body{margin:0;background:#19231e;color:#dfd5b9;font:16px Georgia,"Microsoft YaHei",serif}header{padding:32px 5vw 20px;position:sticky;top:0;background:#19231ef5;z-index:2;border-bottom:1px solid #5c6651}h1{font-size:26px;margin:0 0 12px}p{line-height:1.8;color:#aeb7a4;margin:8px 0}button,select{background:#364535;color:#eee2be;border:1px solid #71816b;border-radius:4px;padding:8px 18px;font:inherit;margin-right:12px}main{padding:28px 5vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}article{background:#2c352c;border:1px solid #535a46;border-radius:6px;padding:14px;text-align:center}h2{font-size:16px;font-weight:normal;margin:8px}.sprite{width:220px;height:220px;margin:auto;background-size:600% 400%;background-repeat:no-repeat}small{color:#a8b29c}</style>
<header><h1>灰城余生 · 逐帧动画素材</h1><p>七张透明图集 · 28段动画 · 每段六帧。这里循环播放原始画帧；游戏中按攻击方向、时长和范围播放。</p><button id="toggle">暂停动画</button><button id="step">下一帧</button><label>播放速度 <select id="rate"><option value="12">12 帧 / 秒</option><option value="6">6 帧 / 秒</option><option value="3">3 帧 / 秒</option></select></label><small id="frame"></small></header><main id="gallery"></main>
<script>
const sheets={physical:['霰弹冲击','长钉命中','重弩木屑','手枪点射'],melee:['扳手重击','警棍短打','菜刀横扫','电锯火花'],elements:['闪电链','强酸喷洒','火焰爆燃','高压水流'],tactical:['飞散书页','砖块碎裂','声波震荡','车辆爆炸'],ground:['地面火区','腐蚀酸池','水花循环','扬尘循环'],projectiles:['书本翻转','砖块翻转','粉笔（备用）','钢钉飞行'],equipment:['重弩飞行','音响诱饵','枪口火光','护甲碎屑']};
let frame=0,playing=true,last=0;const sprites=[];
for(const [sheet,names] of Object.entries(sheets))names.forEach((name,row)=>{const card=document.createElement('article'),art=document.createElement('div'),title=document.createElement('h2');art.className='sprite';art.style.backgroundImage=`url('assets/vfx/${sheet}.png')`;art.dataset.row=row;title.textContent=name;card.append(art,title);gallery.append(card);sprites.push(art)});
function show(){sprites.forEach(el=>el.style.backgroundPosition=`${frame*20}% ${Number(el.dataset.row)*100/3}%`);document.getElementById('frame').textContent=`第 ${frame+1} / 6 帧`}
toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'暂停动画':'继续播放'};step.onclick=()=>{playing=false;toggle.textContent='继续播放';frame=(frame+1)%6;show()};function tick(now){if(playing&&now-last>=1000/Number(rate.value)){frame=(frame+1)%6;last=now;show()}requestAnimationFrame(tick)}show();requestAnimationFrame(tick);
</script></html>
