[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/*.txt,assets/*.md"
exclude_filter="tests/*,docs/*,build/*,dist/*,tools/*,*.md"
export_path="build/GreycitySurvivors.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="../system-supplier/tools/windows_debug_x86_64.exe"
custom_template/release="../system-supplier/tools/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
texture_format/s3tc_bptc=true

